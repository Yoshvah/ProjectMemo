framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false

    session:
        handler_id: null
        cookie_secure: false  # Cookies will not be sent over HTTPS
        cookie_samesite: lax   # Cookies are not available in cross-site contexts
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true


when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
