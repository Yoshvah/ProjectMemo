nelmio_cors:
  defaults:
    allow_origin: ['*']  # Allows all origins; for production, specify the frontend URL here.
    allow_methods: ['POST', 'GET', 'OPTIONS', 'PUT', 'DELETE']
    allow_headers: ['Content-Type', 'Authorization']
    expose_headers: ['Content-Type', 'Authorization']
    max_age: 3600
    hosts: ['^localhost$']  # This line allows requests from localhost
  paths:
    '^/api/':
      allow_origin: ['*']
      allow_headers: ['Content-Type', 'Authorization']
      allow_methods: ['POST', 'OPTIONS']
      max_age: 3600
